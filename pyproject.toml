[project]
dynamic = ['version']
name = 'quartustcl'
description = 'a Python package for interfacing with Intel Quartus Tcl'
readme = 'README.md'
authors = [
    {name = 'Aaron Griffith', email = 'aargri@gmail.com'},
]
license = 'MIT'
license-files = ['LICENSE']

urls.Source = 'https://github.com/agrif/quartustcl/'
urls.Documentation = 'https://quartustcl.readthedocs.io/en/latest/'

keywords = ['quartus', 'tcl']
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)',
]

requires-python = '>= 3.9'
dependencies = []

[project.optional-dependencies]
docs = ['mkdocs >= 1.2, < 1.3', 'mkautodoc >= 0.2.0']

[build-system]
requires = ['setuptools >= 77.0.3', 'setuptools-scm[simple] >= 8']
build-backend = 'setuptools.build_meta'

[tool.setuptools]
packages = ['quartustcl']
